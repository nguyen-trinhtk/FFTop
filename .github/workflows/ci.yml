name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Configure (CMake)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DFFTOP_BUILD_TESTS=ON
          -DFFTOP_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Test
        working-directory: build
        # Tests are expected to fail (in progress)
        continue-on-error: true # TODO: remove once tests pass consistently
        run: ctest --output-on-failure --timeout 60
